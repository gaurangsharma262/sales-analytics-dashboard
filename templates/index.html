<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Intelligence | NextGen</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            900: '#0c4a6e',
                        },
                        tech: {
                            bg: '#0b1120',
                            card: '#1e293b',
                            border: '#334155'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Subtle glowing background orb effect */
        .glow-bg {
            position: fixed;
            top: -10%;
            left: 50%;
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle, rgba(14,165,233,0.1) 0%, rgba(11,17,32,0) 70%);
            transform: translateX(-50%);
            z-index: -1;
            pointer-events: none;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
        }

        /* Chart Canvas Resize Handle */
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
    </style>
</head>
<body class="bg-tech-bg text-slate-200 antialiased min-h-screen relative overflow-x-hidden selection:bg-brand-500 selection:text-white">

    <!-- Ambient Background -->
    <div class="glow-bg"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Header Section -->
        <header class="flex flex-col md:flex-row items-center justify-between mb-10 pb-6 border-b border-white/10">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-white flex items-center gap-3">
                    <svg class="w-8 h-8 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    Sales Intelligence AI
                </h1>
                <p class="text-slate-400 mt-1 text-sm font-medium uppercase tracking-widest pl-11">Enterprise Analytics</p>
            </div>
            
            <!-- Controls Form -->
            <form method="POST" class="mt-6 md:mt-0 glass-panel rounded-xl p-3 flex flex-wrap gap-4 items-center shadow-lg border border-slate-700/50">
                <div class="flex flex-col relative w-full sm:w-auto">
                    <label class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1 px-1">Region</label>
                    <div class="relative">
                        <select name="country" class="appearance-none bg-slate-900 border border-slate-700 text-sm rounded-lg pl-3 pr-10 py-2.5 outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all text-white w-full">
                            {% for c in country_list %}
                            <option value="{{ c }}" {% if selected_country == c %}selected{% endif %}>{{ c }}</option>
                            {% endfor %}
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col">
                    <label class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1 px-1">Date Range</label>
                    <div class="flex items-center gap-2">
                        <input type="date" name="start_date" class="bg-slate-900 border border-slate-700 text-sm rounded-lg px-3 py-2.5 outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 text-white w-full sm:w-auto [color-scheme:dark]">
                        <span class="text-slate-500">-</span>
                        <input type="date" name="end_date" class="bg-slate-900 border border-slate-700 text-sm rounded-lg px-3 py-2.5 outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 text-white w-full sm:w-auto [color-scheme:dark]">
                    </div>
                </div>

                <div class="flex flex-col justify-end pt-5">
                    <button type="submit" class="bg-brand-600 hover:bg-brand-500 text-white text-sm font-semibold py-2.5 px-6 rounded-lg transition-all shadow-[0_0_15px_rgba(14,165,233,0.3)] hover:shadow-[0_0_25px_rgba(14,165,233,0.5)] active:scale-95 flex items-center gap-2">
                        <span>Analyze</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    </button>
                </div>
            </form>
        </header>

        <!-- KPI Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <!-- Total Revenue -->
            <div class="glass-panel p-6 rounded-2xl relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-32 h-32 bg-emerald-500/10 rounded-full blur-3xl -mr-10 -mt-10 transition-transform group-hover:scale-150 duration-700"></div>
                <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-widest mb-2">Total Revenue</h3>
                <div class="flex items-baseline gap-2">
                    <span class="text-4xl font-bold text-white tracking-tight">₹{{ "{:,.2f}".format(total_revenue) }}</span>
                </div>
            </div>

            <!-- Predicted Sales -->
            <div class="glass-panel p-6 rounded-2xl relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-32 h-32 bg-brand-500/10 rounded-full blur-3xl -mr-10 -mt-10 transition-transform group-hover:scale-150 duration-700"></div>
                <div class="flex items-center gap-2 mb-2">
                    <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-widest">Next Month Forecast</h3>
                    <span class="bg-brand-500/20 text-brand-400 text-[10px] px-2 py-0.5 rounded-full border border-brand-500/30 flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-brand-400 animate-pulse"></span> AI
                    </span>
                </div>
                <div class="flex items-baseline gap-2">
                    <span class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-brand-400 to-emerald-400 tracking-tight">₹{{ "{:,.2f}".format(predicted_sales) }}</span>
                </div>
            </div>

            <!-- Active Months -->
            <div class="glass-panel p-6 rounded-2xl relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-32 h-32 bg-purple-500/10 rounded-full blur-3xl -mr-10 -mt-10 transition-transform group-hover:scale-150 duration-700"></div>
                <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-widest mb-2">Recorded Months</h3>
                <div class="flex items-baseline gap-2">
                    <span class="text-4xl font-bold text-white tracking-tight">{{ months|length }}</span>
                    <span class="text-slate-500 font-medium">Periods</span>
                </div>
            </div>
        </div>

        <!-- Charts Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Region Chart -->
            <div class="glass-panel p-6 rounded-2xl flex flex-col">
                <div class="flex items-center justify-between mb-6 border-b border-white/5 pb-4">
                    <h3 class="text-lg font-semibold text-white flex items-center gap-2">
                        <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Top Regions Performance
                    </h3>
                </div>
                <div class="flex-grow w-full chart-container">
                    <canvas id="countryChart"></canvas>
                </div>
            </div>

            <!-- Trend Chart -->
            <div class="glass-panel p-6 rounded-2xl flex flex-col">
                <div class="flex items-center justify-between mb-6 border-b border-white/5 pb-4">
                    <h3 class="text-lg font-semibold text-white flex items-center gap-2">
                        <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg>
                        Revenue Trajectory
                    </h3>
                </div>
                <div class="flex-grow w-full chart-container">
                    <canvas id="monthlyChart"></canvas>
                </div>
            </div>
        </div>

    </div>

    <!-- Chart Configuration Script -->
    <script>
        // Set Chart defaults for dark theme
        Chart.defaults.color = '#94a3b8';
        Chart.defaults.font.family = "'Inter', sans-serif";
        
        const gridConfig = {
            color: 'rgba(255, 255, 255, 0.05)',
            drawBorder: false,
        };

        // --- Country Bar Chart ---
        const ctxCountry = document.getElementById('countryChart').getContext('2d');
        
        // Gradient for Bars
        const barGradient = ctxCountry.createLinearGradient(0, 0, 0, 300);
        barGradient.addColorStop(0, '#38bdf8');
        barGradient.addColorStop(1, '#0284c7');

        new Chart(ctxCountry, {
            type: 'bar',
            data: {
                labels: {{ country_labels | tojson }},
                datasets: [{
                    label: 'Revenue (₹)',
                    data: {{ country_values | tojson }},
                    backgroundColor: barGradient,
                    borderRadius: 6,
                    borderWidth: 0,
                    barThickness: 'flex',
                    maxBarThickness: 45
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(15, 23, 42, 0.9)',
                        titleColor: '#fff',
                        bodyColor: '#e2e8f0',
                        borderColor: 'rgba(255,255,255,0.1)',
                        borderWidth: 1,
                        padding: 10,
                        displayColors: false,
                        cornerRadius: 8
                    }
                },
                scales: {
                    x: { grid: { display: false, drawBorder: false } },
                    y: { grid: gridConfig, beginAtZero: true }
                }
            }
        });

        // --- Monthly Line Chart ---
        const ctxMonth = document.getElementById('monthlyChart').getContext('2d');

        // Gradient for Area fill
        const areaGradient = ctxMonth.createLinearGradient(0, 0, 0, 300);
        areaGradient.addColorStop(0, 'rgba(16, 185, 129, 0.4)');
        areaGradient.addColorStop(1, 'rgba(16, 185, 129, 0.0)');

        new Chart(ctxMonth, {
            type: 'line',
            data: {
                labels: {{ months | tojson }},
                datasets: [{
                    label: 'Revenue Trend (₹)',
                    data: {{ monthly_values | tojson }},
                    borderColor: '#10b981',
                    backgroundColor: areaGradient,
                    borderWidth: 3,
                    pointBackgroundColor: '#0b1120',
                    pointBorderColor: '#10b981',
                    pointBorderWidth: 2,
                    pointRadius: 4,
                    pointHoverRadius: 6,
                    fill: true,
                    tension: 0.4 // Smooth curves
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(15, 23, 42, 0.9)',
                        titleColor: '#fff',
                        bodyColor: '#10b981',
                        borderColor: 'rgba(16,185,129,0.3)',
                        borderWidth: 1,
                        padding: 10,
                        displayColors: false,
                        cornerRadius: 8
                    }
                },
                scales: {
                    x: { grid: { display: false, drawBorder: false } },
                    y: { grid: gridConfig, beginAtZero: true }
                },
                interaction: {
                    intersect: false,
                    mode: 'index',
                },
            }
        });
    </script>
</body>
</html>
